version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # 1. Instalacija uv-a u sustav
    post_create_environment:
      - pip install uv

    # 2. Sinkronizacija zavisnosti u uv virtualno okruženje
    post_install:
      - uv sync --all-extras --group docs

    # 3. Prisiljavanje Read the Docs-a da pokrene Sphinx preko 'uv run'
    # Ovo osigurava da Sphinx vidi myst_parser, temu i vaš modul
    build:
      html:
        - uv run sphinx-build -b html docs/src/ $READTHEDOCS_OUTPUT/html
