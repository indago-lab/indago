version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Read the Docs nema nativno instaliran 'uv', pa ga instaliramo prije builda
    post_create_environment:
      - pip install uv
    # Koristimo uv za instalaciju vašeg paketa i dev grupe (gdje su Sphinx i tema)
    post_install:
      - uv sync --all-extras --group docs

# Putanja do conf.py datoteke unutar vašeg projekta
sphinx:
  configuration: docs/src/conf.py
